def uiArchive = file('.pixelforge/v0.4-overlay.zip')
def ui64 = new StringBuilder()
(0..5).each { i ->
    def part = file(String.format('.pixelforge/o4-%02d.b64', i))
    if (!part.isFile()) throw new GradleException("Missing PixelForge v0.4 chunk: ${part}")
    ui64.append(part.getText('UTF-8').replaceAll('\\s+', ''))
}
uiArchive.bytes = Base64.decoder.decode(ui64.toString())
