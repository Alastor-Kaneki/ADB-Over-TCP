import java.util.Base64
import java.util.zip.ZipInputStream

pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}

def unzipSafely = { File zipFile, File destination ->
    new ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile))).withCloseable { zip ->
        def entry
        while ((entry = zip.nextEntry) != null) {
            def out = new File(destination, entry.name).canonicalFile
            def root = destination.canonicalFile
            if (!(out.path == root.path || out.path.startsWith(root.path + File.separator))) throw new GradleException("Unsafe ZIP path: ${entry.name}")
            if (entry.directory) out.mkdirs()
            else {
                out.parentFile.mkdirs()
                out.withOutputStream { os -> byte[] buffer = new byte[8192]; int n; while ((n = zip.read(buffer)) > 0) os.write(buffer, 0, n) }
            }
            zip.closeEntry()
        }
    }
}

def workDir = file('.pixelforge/work')
def baseArchive = file('.pixelforge/pixelforge.zip')
if (workDir.exists()) workDir.deleteDir()
workDir.mkdirs()

def base64 = new StringBuilder()
(0..4).each { i ->
    def part = file(String.format('.pixelforge/source-%02d.b64', i))
    if (!part.isFile()) throw new GradleException("Missing PixelForge source chunk: ${part}")
    base64.append(part.getText('UTF-8').trim())
}
baseArchive.bytes = Base64.decoder.decode(base64.toString())
unzipSafely(baseArchive, workDir)

def pixelForgeRoot = new File(workDir, 'PixelForge')
