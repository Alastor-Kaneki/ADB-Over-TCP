// v0.4 generation hotfix: intended line-breaks must remain escaped inside Java strings.
def uiActivity = new File(pixelForgeRoot, 'app/src/main/java/dev/pixelforge/editor/MainActivity.java')
def uiText = uiActivity.getText('UTF-8')
uiText = uiText.replace('''overlayText("Untitled
32×32")''', 'overlayText("Untitled\\n32×32")')
uiText = uiText.replace('''l.name+"
"+(l.opacity''', 'l.name+"\\n"+(l.opacity')
uiText = uiText.replace('''(idx+1)+"
"+f.durationMs''', '(idx+1)+"\\n"+f.durationMs')
uiText = uiText.replace('''topInfo.setText("Untitled
"+p.width''', 'topInfo.setText("Untitled\\n"+p.width')
uiActivity.setText(uiText, 'UTF-8')

