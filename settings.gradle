import java.util.Base64
import java.util.zip.ZipInputStream

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

def unzipSafely = { File zipFile, File destination ->
    new ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile))).withCloseable { zip ->
        def entry
        while ((entry = zip.nextEntry) != null) {
            def out = new File(destination, entry.name).canonicalFile
            def root = destination.canonicalFile
            if (!(out.path == root.path || out.path.startsWith(root.path + File.separator))) {
                throw new GradleException("Unsafe ZIP path: ${entry.name}")
            }
            if (entry.directory) {
                out.mkdirs()
            } else {
                out.parentFile.mkdirs()
                out.withOutputStream { os ->
                    byte[] buffer = new byte[8192]
                    int n
                    while ((n = zip.read(buffer)) > 0) os.write(buffer, 0, n)
                }
            }
            zip.closeEntry()
        }
    }
}

def workDir = file('.pixelforge/work')
def archive = file('.pixelforge/pixelforge.zip')
if (workDir.exists()) workDir.deleteDir()
workDir.mkdirs()

def encoded = new StringBuilder()
(0..4).each { i ->
    def part = file(String.format('.pixelforge/source-%02d.b64', i))
    if (!part.isFile()) throw new GradleException("Missing PixelForge source chunk: ${part}")
    encoded.append(part.getText('UTF-8').trim())
}
archive.bytes = Base64.decoder.decode(encoded.toString())
unzipSafely(archive, workDir)

def pixelForgeRoot = new File(workDir, 'PixelForge')
def overlayArchive = file('.pixelforge/feature-overlay.zip')
def overlayEncoded = new StringBuilder()
(0..14).each { i ->
    def part = file(String.format('.pixelforge/o2-%02d.b64', i))
    if (!part.isFile()) throw new GradleException("Missing PixelForge overlay chunk: ${part}")
    overlayEncoded.append(part.getText('UTF-8').trim())
}
overlayArchive.bytes = Base64.decoder.decode(overlayEncoded.toString())
unzipSafely(overlayArchive, pixelForgeRoot)

def pixelForgeApp = new File(pixelForgeRoot, 'app')
def appGradle = new File(pixelForgeApp, 'build.gradle')
if (!appGradle.isFile()) throw new GradleException("PixelForge app/build.gradle was not extracted")

appGradle << '''

// CI-only signing/staging. Reuse the repository's existing development identity
// without duplicating its credentials in this temporary PixelForge build shim.
def pfSigningSource = rootProject.file('app/signing/adb-over-tcp-dev.jks.b64')
def pfSigningDir = rootProject.file('.gradle/pixelforge-signing')
def pfKeystore = new File(pfSigningDir, 'pixelforge-ci.jks')
def repoBuildText = rootProject.file('app/build.gradle').getText('UTF-8')
def passwordMatch = (repoBuildText =~ /def stableSigningPassword = '([^']+)'/)
def aliasMatch = (repoBuildText =~ /def stableSigningAlias = '([^']+)'/)
if (!passwordMatch.find() || !aliasMatch.find()) throw new GradleException('Unable to read repository development signing configuration')
def pfPassword = passwordMatch.group(1)
def pfAlias = aliasMatch.group(1)

if (!pfSigningSource.isFile()) throw new GradleException("CI signing source missing: ${pfSigningSource}")
pfSigningDir.mkdirs()
def pfBytes = java.util.Base64.getDecoder().decode(pfSigningSource.text.trim())
if (!pfKeystore.isFile() || !java.util.Arrays.equals(pfKeystore.bytes, pfBytes)) {
    pfKeystore.bytes = pfBytes
}

android {
    signingConfigs {
        stableDevelopment {
            storeFile pfKeystore
            storePassword pfPassword
            keyAlias pfAlias
            keyPassword pfPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stableDevelopment }
        release { signingConfig signingConfigs.stableDevelopment }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('stageDebugApk', Copy) {
    from "$buildDir/outputs/apk/debug/app-debug.apk"
    into rootProject.file('app/build/outputs/apk/debug')
}
tasks.register('stageReleaseApk', Copy) {
    from "$buildDir/outputs/apk/release/app-release.apk"
    into rootProject.file('app/build/outputs/apk/release')
}
tasks.configureEach { task ->
    if (task.name == 'assembleDebug') task.finalizedBy 'stageDebugApk'
    else if (task.name == 'assembleRelease') task.finalizedBy 'stageReleaseApk'
}
'''

rootProject.name = 'PixelForge CI Build'
include ':app'
project(':app').projectDir = pixelForgeApp
