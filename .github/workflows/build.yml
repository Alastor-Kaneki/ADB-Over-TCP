name: Bootstrap PixelForge Toolchain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Package Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -name '35*' | sort -V | tail -1)"
          if [[ -z "$BUILD_TOOLS_DIR" ]]; then
            echo "Android build-tools 35.x not found" >&2
            exit 1
          fi
          mkdir -p toolchain/android-sdk/{cmdline-tools,build-tools,platforms}
          cp -a "$ANDROID_HOME/cmdline-tools/latest" toolchain/android-sdk/cmdline-tools/
          cp -a "$BUILD_TOOLS_DIR" toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-35" toolchain/android-sdk/platforms/
          cp -a "$ANDROID_HOME/platform-tools" toolchain/android-sdk/
          if [[ -d "$ANDROID_HOME/licenses" ]]; then cp -a "$ANDROID_HOME/licenses" toolchain/android-sdk/; fi
          tar -C toolchain -czf android-sdk-35-linux-x86_64.tar.gz android-sdk
          du -h android-sdk-35-linux-x86_64.tar.gz

      - name: Package Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"
          echo "Gradle root: $GRADLE_ROOT"
          tar -C "$(dirname "$GRADLE_ROOT")" -czf gradle-8.11.1-linux-x86_64.tar.gz "$(basename "$GRADLE_ROOT")"
          du -h gradle-8.11.1-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-android-sdk-35-linux
          path: android-sdk-35-linux-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-gradle-8.11.1-linux
          path: gradle-8.11.1-linux-x86_64.tar.gz
          if-no-files-found: error
