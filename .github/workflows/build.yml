name: Bootstrap PixelForge Gradle Cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Prime AGP 8.7.3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pf-cache-prime
          mkdir -p /tmp/pf-cache-prime/app/src/main/java/dev/pixelforge/cache
          cat > /tmp/pf-cache-prime/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'PixelForgeCachePrime'
          include ':app'
          EOF
          cat > /tmp/pf-cache-prime/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > /tmp/pf-cache-prime/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.pixelforge.cache'
              compileSdk 35
              defaultConfig { applicationId 'dev.pixelforge.cache'; minSdk 26; targetSdk 35; versionCode 1; versionName '1' }
          }
          EOF
          cat > /tmp/pf-cache-prime/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/pf-cache-prime/app/src/main/java/dev/pixelforge/cache/MainActivity.java <<'EOF'
          package dev.pixelforge.cache; public class MainActivity extends android.app.Activity {}
          EOF
          cd /tmp/pf-cache-prime
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pf-gradle-cache/caches
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/pf-gradle-cache/caches/
          if [[ -d "$HOME/.gradle/caches/8.11.1" ]]; then cp -a "$HOME/.gradle/caches/8.11.1" /tmp/pf-gradle-cache/caches/; fi
          if [[ -d "$HOME/.gradle/caches/jars-9" ]]; then cp -a "$HOME/.gradle/caches/jars-9" /tmp/pf-gradle-cache/caches/; fi
          if [[ -d "$HOME/.gradle/caches/transforms-4" ]]; then cp -a "$HOME/.gradle/caches/transforms-4" /tmp/pf-gradle-cache/caches/; fi
          tar -C /tmp/pf-gradle-cache -czf pixelforge-gradle-cache-agp-8.7.3.tar.gz caches
          du -h pixelforge-gradle-cache-agp-8.7.3.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-gradle-cache-agp-8.7.3
          path: pixelforge-gradle-cache-agp-8.7.3.tar.gz
          if-no-files-found: error
