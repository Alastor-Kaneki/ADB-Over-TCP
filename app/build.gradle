plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.alastorkaneki.adbovertcp'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.alastorkaneki.adbovertcp'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

def adbSources = [
        'arm64-v8a'  : 'https://github.com/tytydraco/LADB/raw/refs/heads/main/app/src/main/jniLibs/arm64-v8a/libadb.so',
        'armeabi-v7a': 'https://github.com/tytydraco/LADB/raw/refs/heads/main/app/src/main/jniLibs/armeabi-v7a/libadb.so'
]

tasks.register('fetchAdbBinaries') {
    outputs.files(adbSources.collect { abi, ignored -> file("src/main/jniLibs/${abi}/libadb.so") })
    doLast {
        adbSources.each { abi, source ->
            def destination = file("src/main/jniLibs/${abi}/libadb.so")
            if (!destination.exists() || destination.length() < 1_000_000) {
                destination.parentFile.mkdirs()
                logger.lifecycle("Downloading embedded ADB for ${abi}")
                new URL(source).withInputStream { input ->
                    destination.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('fetchAdbBinaries')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
